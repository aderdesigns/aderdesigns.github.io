<style>
@font-face{font-family:'PP Mori';src:url('PPMori-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'PP Mori';src:url('PPMori-Semibold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;overflow-x:hidden;scroll-behavior:smooth;}
body{font-family:'Host Grotesk',sans-serif;background:#0a0a0a;color:#fff;}

#cs-nav{
  position:fixed;top:0;left:0;right:0;z-index:600;
  height:52px;display:flex;align-items:center;
  justify-content:space-between;padding:0 2.2rem;
  background:#000;
}
#cs-nav.scrolled{background:rgba(0,0,0,.92);backdrop-filter:blur(12px);}
#cs-nav-logo{height:26px;width:auto;cursor:pointer;}
.cs-nav-title{
  font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:#fff;opacity:0;transition:opacity .4s ease;
  position:absolute;left:50%;transform:translateX(-50%);
}
#cs-nav.scrolled .cs-nav-title{opacity:.5;}



#cs-images{padding-top:52px;}

.cs-img-wrap{
  width:100%;display:block;overflow:hidden;
  opacity:0;transform:translateY(30px);
  transition:opacity .7s ease,transform .7s ease;
  contain:layout paint;
}
.cs-img-wrap.visible{opacity:1;transform:translateY(0);}
.cs-img-wrap img,.cs-img-wrap video{width:100%;height:auto;display:block;}
.lazy-video{background:#0a0a0a;}

/* ── Part divider ── */
.part-divider{
  padding:2rem 2.4rem 1.5rem;
  opacity:0;transform:translateY(30px);
  transition:opacity .7s ease,transform .7s ease;
}
.part-divider.visible{opacity:1;transform:translateY(0);}
.part-divider hr{
  border:none;border-top:1px solid rgba(255,255,255,.12);
  margin-bottom:2rem;
}
.part-label{
  font-family:'Host Grotesk',sans-serif;
  font-size:.6rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(255,255,255,.3);
  margin-bottom:.6rem;display:block;
}
.part-title{
  font-family:'PP Mori',sans-serif;
  font-size:clamp(1.48rem,2.34vw,1.79rem);font-weight:600;
  letter-spacing:-.01em;color:#fff;
}
.part-title-small{
  display:block;font-size:33px;font-weight:400;
  letter-spacing:-.01em;color:#c8a96e;
}

/* ── End strip ── */
.cs-end{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem 2rem;gap:1.2rem;border-top:1px solid rgba(255,255,255,.08);
}
.cs-end-label{font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);}
.cs-end-title{font-family:'PP Mori',sans-serif;font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;color:#fff;}
.cs-end-back{
  margin-top:1rem;display:inline-flex;align-items:center;gap:.6rem;
  font-size:.65rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:#fff;text-decoration:none;
  border:1px solid rgba(255,255,255,.2);padding:.75rem 1.8rem;border-radius:100px;
  transition:background .2s,border-color .2s;
}
.cs-end-back:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.4);}

@media (max-width:767px){
  #cs-nav{height:50px;padding:0 16px;}
  #cs-nav-logo{height:22px;}
  .cs-nav-title{font-size:9px;letter-spacing:.13em;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #cs-images{padding-top:50px;}
  .part-divider{padding-left:18px;padding-right:18px;}
  .part-title{font-size:1.35rem;}
  .part-title-small{font-size:26px;}
  .cs-end{padding:4rem 18px;}
  .cs-end-title{text-align:center;line-height:1.05;}
  .cs-end-back{padding:.7rem 1.25rem;font-size:.6rem;}
}
@media (prefers-reduced-motion:reduce){
  html,body{scroll-behavior:auto;}
  .cs-img-wrap,.part-divider{opacity:1;transform:none;transition:none;}
}

<script>
(function(){
  const nav = document.getElementById('cs-nav');
  const revealItems = document.querySelectorAll('.cs-img-wrap, .part-divider');

  function updateNav(){
    nav.classList.toggle('scrolled', window.scrollY > 20);
  }
  updateNav();
  window.addEventListener('scroll', updateNav, {passive:true});

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reducedMotion || !('IntersectionObserver' in window)) {
    revealItems.forEach(el => el.classList.add('visible'));
  } else {
    const revealObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {root:null, rootMargin:'0px 0px 15% 0px', threshold:0.01});

    revealItems.forEach(el => revealObserver.observe(el));
  }

  const videos = document.querySelectorAll('.lazy-video');

  function activateVideo(video){
    if (video.dataset.loaded) return;
    const src = video.dataset.videoSrc;
    if (!src) return;
    const source = document.createElement('source');
    source.src = src;
    source.type = 'video/mp4';
    video.appendChild(source);
    video.dataset.loaded = '1';
    video.load();
    const playPromise = video.play();
    if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(()=>{});
  }

  if (reducedMotion) {
    videos.forEach(video => activateVideo(video));
  } else if ('IntersectionObserver' in window) {
    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          activateVideo(video);
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(()=>{});
        } else if (video.dataset.loaded) {
          video.pause();
        }
      });
    }, {root:null, rootMargin:'120% 0px 120% 0px', threshold:0});

    videos.forEach(video => videoObserver.observe(video));
  } else {
    videos.forEach(video => activateVideo(video));
  }
})();
</script>
