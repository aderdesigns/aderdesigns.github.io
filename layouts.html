<style>
@font-face{font-family:'PP Mori';src:url('PPMori-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'PP Mori';src:url('PPMori-Semibold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;overflow-x:hidden;scroll-behavior:smooth;}
body{font-family:'Host Grotesk',sans-serif;background:#0a0a0a;color:#fff;}
#cs-nav{
  position:fixed;top:0;left:0;right:0;z-index:600;
  height:52px;display:flex;align-items:center;
  justify-content:space-between;padding:0 2.2rem;
  background:#000;
}
#cs-nav.scrolled{background:rgba(0,0,0,.92);backdrop-filter:blur(12px);}
#cs-nav-logo{height:26px;width:auto;cursor:pointer;}
.cs-nav-title{
  font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:#fff;opacity:0;transition:opacity .4s ease;
  position:absolute;left:50%;transform:translateX(-50%);
}
#cs-nav.scrolled .cs-nav-title{opacity:.5;}

#nav-sentinel{position:absolute;top:0;left:0;width:1px;height:1px;pointer-events:none;opacity:0;}\n#cs-images{padding-top:52px;}
.cs-img-wrap{
  contain:layout paint;

  width:100%;display:block;overflow:hidden;
  opacity:0;transform:translateY(30px);
  transition:opacity .7s ease,transform .7s ease;
}
.cs-img-wrap.visible{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion:reduce){.cs-img-wrap{transition:none;transform:none;opacity:1;}}
.cs-img-wrap img,.cs-img-wrap video{width:100%;height:auto;display:block;}
.cs-end{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem 2rem;gap:1.2rem;border-top:1px solid rgba(255,255,255,.08);
}
.cs-end-label{font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);}
.cs-end-title{font-family:'PP Mori',sans-serif;font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;color:#fff;}
.cs-end-back{
  margin-top:1rem;display:inline-flex;align-items:center;gap:.6rem;
  font-size:.65rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:#fff;text-decoration:none;
  border:1px solid rgba(255,255,255,.2);padding:.75rem 1.8rem;border-radius:100px;
  transition:background .2s,border-color .2s;
}
.cs-end-back:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.4);}

@media (max-width:767px){
  #cs-nav{height:50px;padding:0 16px;}
  #cs-nav-logo{height:22px;}
  .cs-nav-title{font-size:9px;letter-spacing:.13em;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #cs-images{padding-top:50px;}
  .cs-end{padding:4rem 18px;}
  .cs-end-title{font-size:clamp(1.8rem,9vw,3rem);text-align:center;line-height:1.05;}
}

/* Loading screen */
#portfolio-loader{position:fixed;inset:0;z-index:100000;background:#000;display:grid;place-items:center;overflow:hidden;pointer-events:auto;opacity:0;visibility:hidden;transition:clip-path .9s cubic-bezier(.77,0,.18,1),opacity .2s ease;}
#portfolio-loader.is-done{clip-path:inset(0 0 100% 0);pointer-events:none;}
#portfolio-loader::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.09;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.12),transparent 34%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,22px 22px,22px 22px;}
.pl-core{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;}
.pl-logo{display:block;width:120px;max-width:32vw;height:auto;opacity:.96;transform:translateY(0) scale(1);filter:blur(0);will-change:filter,opacity,transform;animation:pl-logo-breathe 3.6s ease-in-out infinite;}
@keyframes pl-logo-breathe{0%,100%{opacity:.94;filter:blur(0);transform:translateY(0) scale(1)}35%{opacity:.82;filter:blur(2.4px);transform:translateY(-1px) scale(1.01)}55%{opacity:.78;filter:blur(3px);transform:translateY(0) scale(1.015)}72%{opacity:.92;filter:blur(.8px);transform:translateY(0) scale(1.008)}}
.pl-status{width:min(64vw,220px);margin-top:20px;}
.pl-track{width:100%;height:2px;background:rgba(255,255,255,.14);overflow:hidden;}
.pl-fill{display:block;width:0;height:100%;background:#ed1c24;transition:width .16s linear;}
.pl-meta{margin-top:8px;display:flex;justify-content:space-between;gap:16px;width:100%;font:9px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42);}
.pl-percent{color:#fff;font-variant-numeric:tabular-nums;}
@media(max-width:600px){.pl-logo{width:96px}.pl-status{width:min(70vw,190px);margin-top:16px}.pl-meta{font-size:8px;letter-spacing:.12em}}
@media(prefers-reduced-motion:reduce){.pl-logo{animation:none;filter:none;opacity:1;transform:none}#portfolio-loader{transition:none}.pl-fill{transition:none}}

</style>
</head>
<body>

<script>
(function(){
  var nav=document.getElementById('cs-nav');
  var sentinel=document.getElementById('nav-sentinel');
  var wraps=document.querySelectorAll('.cs-img-wrap');
  var lazyVideos=document.querySelectorAll('.lazy-video');

  if (sentinel && 'IntersectionObserver' in window) {
    var navObserver=new IntersectionObserver(function(entries){
      nav.classList.toggle('scrolled', !entries[0].isIntersecting);
    }, {threshold:0,rootMargin:'-20px 0px 0px 0px'});
    navObserver.observe(sentinel);
  } else {
    function updateNav(){nav.classList.toggle('scrolled',window.scrollY>20);}
    window.addEventListener('scroll',updateNav,{passive:true});
    updateNav();
  }

  var revealObserver;
  if ('IntersectionObserver' in window) {
    revealObserver=new IntersectionObserver(function(entries,observer){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    },{threshold:0.01,rootMargin:'0px 0px 18% 0px'});
    wraps.forEach(function(w){revealObserver.observe(w);});
  } else {
    wraps.forEach(function(w){w.classList.add('visible');});
  }

  function loadVideo(video){
    if(video.dataset.loaded)return;
    var src=video.dataset.videoSrc;
    if(!src)return;
    video.src=src;
    video.dataset.loaded='1';
    video.load();
  }

  if(lazyVideos.length && 'IntersectionObserver' in window){
    var loadObserver=new IntersectionObserver(function(entries,observer){
      entries.forEach(function(entry){
        if(!entry.isIntersecting)return;
        loadVideo(entry.target);
        observer.unobserve(entry.target);
      });
    },{threshold:0,rootMargin:'1000px 0px 800px 0px'});
    lazyVideos.forEach(function(v){loadObserver.observe(v);});
  }else{
    lazyVideos.forEach(loadVideo);
  }

  if('IntersectionObserver' in window){
    var playObserver=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var v=entry.target;
        if(entry.isIntersecting){
          var p=v.play();
          if(p&&p.catch)p.catch(function(){});
        }else{
          v.pause();
        }
      });
    },{threshold:0.15});
    document.querySelectorAll('#cs-images video').forEach(function(v){playObserver.observe(v);});
  }
})();
</script>

<script>
(function(){
  var loader=document.getElementById('portfolio-loader');
  var fill=document.getElementById('pl-progress-fill');
  var percent=document.getElementById('pl-percent');
  var first=document.querySelector('#cs-images video');
  if(!loader||!first)return;
  first.preload='auto';
  var started=performance.now(),finished=false;
  setTimeout(function(){
    if(!finished){
      loader.style.opacity='1';
      loader.style.visibility='visible';
      loader.style.pointerEvents='auto';
    }
  },250);
  function setProgress(v){v=Math.max(0,Math.min(100,v));if(fill)fill.style.width=v.toFixed(1)+'%';if(percent)percent.textContent=String(Math.round(v)).padStart(2,'0')+'%';}
  function close(){
    if(finished)return; finished=true; setProgress(100);
    var wait=0;
    setTimeout(function(){loader.classList.add('is-done');setTimeout(function(){if(loader&&loader.parentNode)loader.parentNode.removeChild(loader);},950);},wait);
  }
  function ready(){if(first.readyState>=2)close();}
  setProgress(12);
  var p=0;
  function tick(){if(finished)return;p=Math.min(88,p+1.8);setProgress(p);requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
  if(first.readyState>=2) ready();
  else {
    first.addEventListener('loadeddata',ready,{once:true});
    first.addEventListener('canplay',ready,{once:true});
    first.addEventListener('error',close,{once:true});
  }
  setTimeout(close,6000);
})();
</script>
